# Applied automatically by the platform (root app platform-tenants). Manual fallback, control plane:
#   sudo kubectl apply -f https://raw.githubusercontent.com/Everesto-Inc/agency-frontend-gitops/main/argocd/secret-stores.yaml
# needs secret infisical-agency-frontend-auth in namespace external-secrets
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical-agency-frontend-dev
spec:
  conditions:
    - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: dev-agency-frontend } }
  provider:
    infisical:
      hostAPI: https://infisical.everesto.live
      auth:
        universalAuthCredentials:
          clientId: { name: infisical-agency-frontend-auth, namespace: external-secrets, key: clientId }
          clientSecret: { name: infisical-agency-frontend-auth, namespace: external-secrets, key: clientSecret }
      secretsScope: { projectSlug: orchid-agency-frontend-gitops-t8io, environmentSlug: dev, secretsPath: / }
