# All secrets of Infisical project "orchid-agency-frontend-gitops" (older apps: "agency-frontend-gitops"), env dev → Secret "agency-frontend"
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agency-frontend
spec:
  refreshInterval: 5m
  secretStoreRef: { kind: ClusterSecretStore, name: infisical-agency-frontend-dev }
  target: { name: agency-frontend }
  dataFrom:
    - find: { name: { regexp: ".*" } }
